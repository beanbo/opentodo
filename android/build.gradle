buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'org.opentodo.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.opentodo.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
            // B-9.6 (CRITICAL): androiddeployqt stages the app .so, every Qt
            // library, the Qt plugins AND libc++_shared.so into <build>/libs/
            // <abi>/. Without this line gradle falls back to the default jniLibs
            // dir (src/main/jniLibs, which is empty), so NONE of those native
            // libraries are packaged — the APK ships with an empty lib/ and
            // crashes immediately at startup with
            //   java.lang.UnsatisfiedLinkError: dlopen failed:
            //   library "libc++_shared.so" not found
            // (QtLoader.loadLibraryHelper). The canonical Qt Android gradle
            // template always sets this; our trimmed-down sourceSets had
            // dropped it, which made the APK unrunnable on every device.
            jniLibs.srcDirs = ['libs']
            // B-9.8 (CRITICAL): androiddeployqt generates
            // <build>/assets/android_rcc_bundle.rcc, which contains EVERY QML
            // module the app imports (QtQuick, QtQuick.Window,
            // QtQuick.Controls.Material, ...). Without this srcDir gradle never
            // packages it, so the APK ships with an empty assets/ and the QML
            // engine fails to load Main.qml at runtime:
            //   module "QtQuick.Window" is not installed
            // QQmlApplicationEngine then produces no root object and the app
            // exits immediately after Qt initialises. Same omission class as
            // jniLibs above — the canonical Qt template sets it; ours dropped it.
            assets.srcDirs = ['assets']
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def requested = details.requested
        // kotlin-stdlib 1.8+ bundles jdk7 and jdk8 classes. Redirect the old
        // split jdk7/jdk8 jars to the unified stdlib to remove duplicate classes.
        if (requested.group == 'org.jetbrains.kotlin' &&
                requested.module.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useTarget group: requested.group,
                name: 'kotlin-stdlib',
                version: '1.8.22'
            details.because 'kotlin-stdlib 1.8+ includes jdk7/jdk8 classes'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    // Qt 6 Android runtime jars. B-9.7 (CRITICAL): must include the WHOLE jar/
    // directory, not just Qt6Android.jar. Each Qt module ships its Java side in
    // a separate jar (Qt6AndroidQuick.jar -> org.qtproject.qt.android.QtQuickView,
    // Qt6AndroidNetwork.jar, ...). libQt6Quick's JNI_OnLoad calls
    // FindClass("org/qtproject/qt/android/QtQuickView") at load time and returns
    // JNI_ERR if that class isn't in the dex, crashing the app at startup with:
    //   java.lang.UnsatisfiedLinkError: JNI_ERR returned from JNI_OnLoad in
    //   libQt6Quick_<abi>.so   (preceded by ClassNotFoundException: QtQuickView)
    // Hardcoding only Qt6Android.jar dropped QtQuickView (and the other module
    // jars). (Provides QtActivityBase, QtQuickView, QtNetwork, etc.)
    //
    // androiddeployqt stages the Qt jars every linked Qt module needs into
    // <build>/libs/ (next to the per-ABI native libs), exactly like the
    // canonical Qt gradle template consumes them — so take them from there
    // instead of a hardcoded C:/Qt/6.11.0/... path that broke every other
    // machine / Qt install / OS.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    // Escape hatch for a custom pipeline that does NOT stage the jars: pass
    // -PqtAndroidJarDir=<Qt>/<android kit>/jar (or set it in
    // gradle.properties). Do not combine with staged libs/*.jar — the classes
    // would be duplicated.
    if (project.hasProperty('qtAndroidJarDir')) {
        implementation fileTree(dir: project.property('qtAndroidJarDir'), include: ['*.jar'])
    }
}
