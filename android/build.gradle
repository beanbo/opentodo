buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'org.opentodo.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.opentodo.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def requested = details.requested
        // kotlin-stdlib 1.8+ bundles jdk7 and jdk8 classes. Redirect the old
        // split jdk7/jdk8 jars to the unified stdlib to remove duplicate classes.
        if (requested.group == 'org.jetbrains.kotlin' &&
                requested.module.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useTarget group: requested.group,
                name: 'kotlin-stdlib',
                version: '1.8.22'
            details.because 'kotlin-stdlib 1.8+ includes jdk7/jdk8 classes'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    // Qt 6 Android runtime — provides org.qtproject.qt.android.QtActivityBase
    // and all other Qt Java bindings used by MainActivity et al.
    implementation files('C:/Qt/6.11.0/android_arm64_v8a/jar/Qt6Android.jar')
}
