<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8df0"/>
      <stop offset="1" stop-color="#2a4faa"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (modern app icon shape).
       Indigo/blue gradient — distinct from Todoist's red brand mark. -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- Open ring (270 deg arc, gap in upper-right). The 'O' of OpenTodo. -->
  <path d="M 256 96 A 160 160 0 1 0 416 256"
        stroke="#ffffff"
        stroke-width="36"
        fill="none"
        stroke-linecap="round"
        opacity="0.92"/>

  <!-- Bold checkmark whose tail extends outward through the gap.
       Reads as: task completed, the open ring is sealed by the check. -->
  <path d="M 160 248 L 232 322 L 444 76"
        stroke="url(#check)"
        stroke-width="46"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
