name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qt5compat
          tools: 'tools_mingw1310 tools_cmake tools_ninja'
          # aqtinstall 3.3.0 (the latest release) predates Qt 6.11's per-compiler
          # Windows repo folders (qt6_6110/qt6_6110_mingw); pin the upstream fix
          # (miurahr/aqtinstall#1000) until a release ships it.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'

      - name: Build Release
        shell: pwsh
        run: |
          $env:PATH = "$env:IQTA_TOOLS\mingw1310_64\bin;" + $env:PATH
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build

      - name: Deploy with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/OpenTodo
          Copy-Item build/OpenTodo.exe dist/OpenTodo/
          $env:PATH = "$env:IQTA_TOOLS\mingw1310_64\bin;" + $env:PATH
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --qmldir qml --no-translations dist/OpenTodo/OpenTodo.exe

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OpenTodo/* -DestinationPath OpenTodo-${{ github.ref_name }}-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: OpenTodo-*.zip
          generate_release_notes: true
